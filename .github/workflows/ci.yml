name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NFPM_VERSION: "2.46.3"
  NODE_VERSION: "20"

# Pipeline shape (PR):
#
#   commitlint
#   version ──► build-app ──► test-deb
#
# Pipeline shape (push to main, adds release):
#
#   version ──► build-app ──► test-deb ──► release

jobs:
  # ---------------------------------------------------------------------------
  # Lint PR commit messages
  # ---------------------------------------------------------------------------
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  # ---------------------------------------------------------------------------
  # Compute version string for build-app + release summary
  # ---------------------------------------------------------------------------
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.v.outputs.BASE }}
      full: ${{ steps.v.outputs.FULL }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short HEAD)
          echo "BASE=${BASE}"        >> $GITHUB_OUTPUT
          echo "FULL=${BASE}+${SHA}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Typecheck + test + Vite build + .deb package. Upload as artifact for
  # test-deb + release to reuse — single build, no duplication.
  # ---------------------------------------------------------------------------
  build-app:
    name: Build .deb
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build Vite bundle
        run: npm run build

      - name: Install nfpm (pinned)
        run: |
          set -e
          url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          curl -fsSL "$url" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
          rm /tmp/nfpm.deb

      - name: Build .deb
        # Use the FULL version (BASE+SHA, e.g. 1.0.0+4bdc7d8) so the .deb
        # control file reflects the exact commit the artifact was built from.
        run: bash packaging/scripts/build-deb.sh ${{ needs.version.outputs.full }}

      - uses: actions/upload-artifact@v4
        with:
          name: unreact-platform-deb
          path: dist-deb/unreact-platform.deb
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Install the built .deb on a clean runner + hit endpoints. Catches packaging
  # mistakes BEFORE we release.
  # ---------------------------------------------------------------------------
  test-deb:
    name: Smoke-test .deb
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unreact-platform-deb
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install .deb
        run: sudo apt-get install -y ./unreact-platform.deb

      - name: Verify package registered
        run: dpkg -s unreact-platform | grep -E "^(Status|Version):"

      - name: Verify systemd units shipped
        run: |
          for f in /lib/systemd/system/unreact-platform.service \
                   /lib/systemd/system/unreact-platform-update.service \
                   /lib/systemd/system/unreact-platform-update.timer; do
            [ -f "$f" ] || { echo "FAIL: $f missing"; exit 1; }
          done
          echo "PASS: all systemd units present"

      - name: Verify updater script shipped
        run: |
          [ -x /usr/bin/unreact-platform-update ] || \
            { echo "FAIL: /usr/bin/unreact-platform-update missing or not executable"; exit 1; }
          echo "PASS: unreact-platform-update present + executable"

      - name: Verify postinstall artifacts (user, files, installed-tag)
        run: |
          id unreact-platform >/dev/null   || { echo "FAIL: service user 'unreact-platform' not created"; exit 1; }
          test -f /opt/unreact-platform/server.cjs           || { echo "FAIL: server.cjs missing from /opt/unreact-platform/"; exit 1; }
          test -d /opt/unreact-platform/dist                  || { echo "FAIL: dist/ missing from /opt/unreact-platform/"; exit 1; }
          test -f /etc/unreact-platform/unreact-platform.env  || { echo "FAIL: env conffile missing from /etc/unreact-platform/"; exit 1; }
          test -f /var/lib/unreact-platform/installed-tag     || { echo "FAIL: /var/lib/unreact-platform/installed-tag missing (postinstall didn't seed it)"; exit 1; }
          echo "PASS: postinstall artifacts present (user + files + installed-tag)"

      - name: "Verify systemd: service+timer enabled, service active(running)"
        run: |
          # postinstall.sh already ran `systemctl enable+restart unreact-platform`.
          # The next ~15s must take it to active(running) — anything else (signal,
          # failed, restart-loop) means a regression like the MemoryDenyWriteExecute
          # SIGTRAP that hit v1.0.3.

          systemctl is-enabled unreact-platform.service       | grep -qx enabled || { echo "FAIL: unreact-platform.service not enabled"; exit 1; }
          systemctl is-enabled unreact-platform-update.timer  | grep -qx enabled || { echo "FAIL: unreact-platform-update.timer not enabled"; exit 1; }
          echo "PASS: service + update timer both enabled"

          dump_on_fail() {
            echo "----- systemctl status -----"
            sudo systemctl status unreact-platform --no-pager -l || true
            echo "----- journalctl -----"
            sudo journalctl -u unreact-platform --no-pager -n 80 || true
          }

          for i in $(seq 1 15); do
            STATE=$(systemctl show -p ActiveState --value unreact-platform 2>/dev/null || echo unknown)
            SUB=$(systemctl show -p SubState    --value unreact-platform 2>/dev/null || echo unknown)
            if [ "$STATE" = "active" ] && [ "$SUB" = "running" ]; then
              echo "PASS: unreact-platform reached active(running) after ${i}s"
              break
            fi
            if [ "$STATE" = "failed" ]; then
              echo "FAIL: unreact-platform entered failed state after ${i}s"
              dump_on_fail
              exit 1
            fi
            sleep 1
          done

          FINAL_STATE=$(systemctl show -p ActiveState --value unreact-platform)
          FINAL_SUB=$(systemctl show -p SubState    --value unreact-platform)
          if [ "$FINAL_STATE" != "active" ] || [ "$FINAL_SUB" != "running" ]; then
            echo "FAIL: service is $FINAL_STATE/$FINAL_SUB after 15s"
            dump_on_fail
            exit 1
          fi

          # Crash-loop check: any restart within the first 15s is a strong signal
          # something is killing the process (SIGTRAP / SIGKILL / etc.).
          RESTARTS=$(systemctl show -p NRestarts --value unreact-platform)
          if [ "${RESTARTS:-0}" -gt 0 ]; then
            echo "FAIL: service restarted $RESTARTS time(s) — likely crashing on startup"
            dump_on_fail
            exit 1
          fi

      - name: Smoke-test HTTP endpoints via systemd (default port 28291)
        run: |
          fail() {
            echo "FAIL: $*"
            sudo systemctl status unreact-platform --no-pager -l || true
            sudo journalctl -u unreact-platform --no-pager -n 50 || true
            exit 1
          }

          # The systemd-managed server listens on the .deb's default port (28291,
          # from /etc/unreact-platform/unreact-platform.env). Wait briefly in case
          # /healthz isn't responsive the instant the unit goes active.
          for i in $(seq 1 10); do
            curl -sf -o /dev/null http://localhost:28291/healthz && break
            sleep 1
          done

          HTTP=$(curl -s -o /tmp/home.html -w "%{http_code}" http://localhost:28291/)
          [ "$HTTP" = "200" ] || fail "/ returned $HTTP"
          grep -q "un-React" /tmp/home.html || fail "/ did not contain 'un-React'"

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:28291/step/1)
          [ "$HTTP" = "200" ] || fail "/step/1 returned $HTTP (SPA fallback broken)"

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:28291/healthz)
          [ "$HTTP" = "200" ] || fail "/healthz returned $HTTP"

          echo "PASS: systemd-managed server responding on :28291, all endpoints OK"

  # ---------------------------------------------------------------------------
  # Release: downloads the artifact built earlier (no rebuild) and lets
  # semantic-release attach it via @semantic-release/github.
  # ---------------------------------------------------------------------------
  release:
    name: Release v${{ needs.version.outputs.full }}
    runs-on: ubuntu-latest
    needs: [version, test-deb]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci --no-audit --no-fund

      - name: Download .deb artifact built earlier
        uses: actions/download-artifact@v4
        with:
          name: unreact-platform-deb
          path: dist-deb/

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Summary
        run: |
          echo "======================================="
          echo "  unreact-platform pipeline summary"
          echo "======================================="
          echo "  Version computed: ${{ needs.version.outputs.full }}"
          echo "  Commit:           ${{ github.sha }}"
          echo "  Artifact:         dist-deb/unreact-platform.deb"
          echo "======================================="
